
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api-anyu.scaleautomatization.tech;

    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/api-anyu.scaleautomatization.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-anyu.scaleautomatization.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name api-anyu.scaleautomatization.tech;

    return 301 https://$host$request_uri;
}
